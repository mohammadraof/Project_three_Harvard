<!-- Templates -->
{% extends "library/base.html" %}
{% block content %}
    <h1>Books</h1>
    <form method="get">
        <input
            type="text"
            name="q"
            value="{{ query }}"
            placeholder="Search by title or author"
        >

        <select name="status">
            <option value="">All books</option>

            <option
                value="available"
                {% if status == "available" %}selected{% endif %}
            >
                Available
            </option>

            <option
                value="borrowed"
                {% if status == "borrowed" %}selected{% endif %}
            >
             Borrowed
            </option>
        </select>

        <button type="submit">Search</button>
    </form>
    {% for book in books %}
    <article>
        <h2>{{ book.title }}</h2>
        <p>{{ book.author }} _ {{ book.year}}</p>
        <p>Available: {{ book.available }}</p>
    </article>
  {% endfor %}
{% endblock %}
