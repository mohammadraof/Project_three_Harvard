{% extends "library/base.html" %}

{% block content %}

<h1>Books</h1>

{% for book in books %}

    <article>
        <h2>{{ book.title }}</h2>

        <p>{{ book.author }} — {{ book.year }}</p>

        <p>
            Available:
            {{ book.available }}
        </p>

        {% if book.available %}
            <form method="post" action="{% url 'borrow_book' book.id 1 %}">
                {% csrf_token %}
                <button type="submit">Borrow</button>
            </form>
        {% else %}
            <form method="post" action="{% url 'return_book' book.id %}">
                {% csrf_token %}
                <button type="submit">Return</button>
            </form>
        {% endif %}

    </article>

{% endfor %}

{% endblock %}
